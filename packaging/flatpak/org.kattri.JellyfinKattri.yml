# Flatpak manifest for Jellyfin Kattri. UNVERIFIED: this has not been built.
#
# Build (from the repository root, after generating cargo-sources.json):
#   flatpak-builder --force-clean --user --install-deps-from=flathub \
#     build-dir packaging/flatpak/org.kattri.JellyfinKattri.yml
#
# Runtime choice. The app is egui and winit, with no GNOME libraries, so the
# org.freedesktop.Platform runtime is used. Its GNOME runtime pin is not applicable.
# Runtime and SDK are pinned to branch 25.08, which must match each other. The Flathub Rust
# extension for 25.08 is older than rust-toolchain.toml, so the pinned Rust release is
# installed from its checksummed archive for the build and removed from the app. The branch was not checked against the current Flathub
# listing; check it before the first build.
#
# libmpv is the pinned LGPL linux-x64 archive from packaging/libmpv/manifest.toml (same URL
# and SHA-256), not a source build: FFmpeg, libplacebo and dav1d are linked into it
# statically. Its remaining shared dependencies come from the runtime, except libass and
# uchardet, which the runtime does not ship and are built below from checksummed releases.
#
# Offline build: flatpak-builder runs cargo with --offline. Every crate comes from
# cargo-sources.json, generated from Cargo.lock with the flatpak-cargo-generator tool
# (version not recorded here). The generated file is not committed to the repository.
#
# Permissions: the finish args grant only the display sockets, GPU access, audio, the
# network (needed to reach the Jellyfin server), and no general filesystem access. Files
# are chosen through the file portal.

id: org.kattri.JellyfinKattri
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: kattri

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network

build-options:
  env:
    CARGO_HOME: /run/build/kattri/cargo
  append-path: /app/lib/rust/bin

modules:
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_BINARY=OFF
      - -DBUILD_STATIC=OFF
      # uchardet 0.0.8 declares cmake_minimum_required(2.8), which CMake 4 refuses.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
        sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a

  # Keep the URL and SHA-256 equal to [platforms.linux-x64] in packaging/libmpv/manifest.toml.
  - name: libmpv
    buildsystem: simple
    build-commands:
      - install -Dm755 libmpv.so.2 /app/lib/libmpv.so.2
      - install -d /app/share/licenses/libmpv
      - install -m644 LICENSE.* BUILD-INFO.txt /app/share/licenses/libmpv/
    sources:
      - type: archive
        url: https://github.com/Archerkattri/jellyfin-kattri/releases/download/libmpv-v0.41.0-abe7469/kattri-libmpv-linux-x64-v0.41.0.tar.gz
        sha256: cc4217e1caf6d1c1d99285e375a4ea598313a0a183b93ba0deb9032773f12fb0

  # Keep the version equal to rust-toolchain.toml.
  - name: rust
    buildsystem: simple
    # Stripping the toolchain breaks its LLVM library; nothing of it ships.
    build-options:
      strip: false
      no-debuginfo: true
    cleanup:
      - "*"
    build-commands:
      - ./install.sh --prefix=/app/lib/rust --disable-ldconfig --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7

  - name: kattri
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/kattri/cargo
    build-commands:
      - cargo --offline build --release --locked -p egui-gl-host-proof --bin jellyfin-kattri
      - install -Dm755 target/release/jellyfin-kattri /app/bin/kattri
      - mkdir -p /app/share/applications
      - sed 's/^Icon=kattri$/Icon=org.kattri.JellyfinKattri/' packaging/linux/share/kattri.desktop > /app/share/applications/org.kattri.JellyfinKattri.desktop
      - install -Dm644 packaging/linux/icons/kattri.svg /app/share/icons/hicolor/scalable/apps/org.kattri.JellyfinKattri.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - dist
          - build
          - legacy
          - .local
      - cargo-sources.json
