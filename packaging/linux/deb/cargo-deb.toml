# cargo-deb metadata for the kattri package.
#
# cargo-deb reads only [package.metadata.deb] from a Cargo.toml, so this file is
# appended to proofs/egui-gl-host/Cargo.toml by the release-linux workflow, in the CI
# checkout only, before `cargo deb` runs. Do not commit that change.
#
# Binary sources use cargo-deb's special target/release path so they resolve the
# workspace target directory. Other paths are relative to the package root.
#
# The release workflow stages the checksum-verified libmpv archive under
# target/kattri-libmpv. It and the Linux x64 license/build notices are private package assets.
# libjpeg.so.8 is staged there too for RPM systems that do not provide that ABI; libmpv's
# $ORIGIN RUNPATH applies only to dependencies in this private directory.

[package.metadata.deb]
name = "kattri"
maintainer = "Jellyfin Kattri <krishiattriwork@gmail.com>"
priority = "optional"
changelog = "../../packaging/linux/deb/changelog"
section = "video"
# No license-file: it would copy the full GPL text into the package copyright file, which lintian
# rejects. The crate license (GPL-3.0-only) is written as a short entry that points at
# /usr/share/common-licenses/GPL-3.
copyright = "2026 Jellyfin Kattri contributors"
# Strip the packaged binary. Release builds carry no debug info (profile debug = 0), so there
# is no dbgsym package; stripping still removes the remaining symbols.
separate-debug-symbols = true
extended-description = """
Jellyfin Kattri is a native client for Jellyfin media servers. Playback uses the
bundled pinned libmpv runtime and the native libraries listed as package dependencies."""
depends = "$auto, libass9, libva2, libva-drm2, libuchardet0, libxfixes3, libx11-6, libasound2, libpulse0, libdrm2, libgbm1, libegl1, zlib1g, libstdc++6, libxkbcommon-x11-0"
assets = [
    ["target/release/jellyfin-kattri", "usr/bin/kattri", "755"],
    ["../../target/kattri-libmpv/libmpv.so.2", "usr/lib/kattri/libmpv.so.2", "644"],
    ["../../target/kattri-libmpv/libjpeg.so.8", "usr/lib/kattri/libjpeg.so.8", "644"],
    ["../../packaging/linux/share/kattri.desktop", "usr/share/applications/kattri.desktop", "644"],
    ["../../packaging/linux/icons/kattri.svg", "usr/share/icons/hicolor/scalable/apps/kattri.svg", "644"],
    # Compressed by the release workflow (gzip -9n) before cargo deb runs.
    ["../../target/kattri.1.gz", "usr/share/man/man1/kattri.1.gz", "644"],
    # Ship the project license, embedded font license, third-party notice, pinned archive
    # notice/licenses, build record, and bundled JPEG notice.
    ["../../LICENSE", "usr/share/doc/kattri/LICENSE", "644"],
    ["../../assets/fonts/OFL.txt", "usr/share/doc/kattri/OFL.txt", "644"],
    ["../../NOTICE", "usr/share/doc/kattri/NOTICE", "644"],
    ["../../packaging/libmpv/NOTICE.txt", "usr/share/doc/kattri/libmpv-NOTICE.txt", "644"],
    ["../../target/kattri-libmpv/BUILD-INFO.txt", "usr/share/doc/kattri/libmpv-BUILD-INFO.txt", "644"],
    ["../../target/kattri-libmpv/BUILD-INFO.libjpeg-turbo.txt", "usr/share/doc/kattri/libjpeg-turbo-BUILD-INFO.txt", "644"],
    ["../../target/kattri-libmpv/LICENSE.mpv.LGPL", "usr/share/doc/kattri/licenses/libmpv.LGPL", "644"],
    ["../../target/kattri-libmpv/LICENSE.ffmpeg.LGPL", "usr/share/doc/kattri/licenses/ffmpeg.LGPL", "644"],
    ["../../target/kattri-libmpv/LICENSE.libplacebo.LGPL", "usr/share/doc/kattri/licenses/libplacebo.LGPL", "644"],
    ["../../target/kattri-libmpv/LICENSE.dav1d.BSD-2-Clause", "usr/share/doc/kattri/licenses/dav1d.BSD-2-Clause", "644"],
    ["../../target/kattri-libmpv/LICENSE.libdisplay-info.MIT", "usr/share/doc/kattri/licenses/libdisplay-info.MIT", "644"],
    ["../../target/kattri-libmpv/LICENSE.libjpeg-turbo", "usr/share/doc/kattri/licenses/libjpeg-turbo", "644"],
    # Lintian overrides: the bundled libmpv/libjpeg are intentional; the tag below documents it.
    ["../../packaging/linux/deb/lintian-overrides", "usr/share/lintian/overrides/kattri", "644"],
]
