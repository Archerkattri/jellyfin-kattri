[package]
name = "jellyfin-playback-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3"
getrandom = "0.4.3"
jellyfin-api = { path = "../jellyfin-api" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
mock-jellyfin = { path = "../mock-jellyfin" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
