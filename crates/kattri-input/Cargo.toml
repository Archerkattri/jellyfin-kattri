[package]
name = "kattri-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["gilrs-backend"]
# Gamepad backend on gilrs (owner decision, 2026-10-15). Disable with --no-default-features.
gilrs-backend = ["dep:gilrs"]

[dependencies]
serde_json = "1"
thiserror = "2"
# Pinned exactly: gilrs event semantics are relied on by the button and axis mapping.
gilrs = { version = "=0.11.2", optional = true }
