[package]
name = "kattri-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Production log file for Jellyfin Kattri: rotation, level control and redaction"

[dependencies]
directories = "6"
kattri-guard = { path = "../kattri-guard" }
thiserror = "2"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "registry"] }

[dev-dependencies]
jellyfin-api = { path = "../jellyfin-api" }
mock-jellyfin = { path = "../mock-jellyfin" }
tokio = { version = "1", features = ["macros", "rt"] }
