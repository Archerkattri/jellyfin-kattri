[package]
name = "kattri-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Opens the real Discord IPC pipe or socket. Off by default: the default build and the
# test suite never touch an endpoint.
discord-ipc = []

[dependencies]
kattri-client-core = { path = "../client-core" }
kattri-guard = { path = "../kattri-guard" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
