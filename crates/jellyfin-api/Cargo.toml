[package]
name = "jellyfin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
mock-jellyfin = { path = "../mock-jellyfin" }
