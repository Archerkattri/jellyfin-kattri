# Fresh-runner installation and window-startup checks for artifacts from one packaging run.
# These jobs do not validate audible output, real-server playback, hardware decode, or HDR.
name: Clean-runner installation and startup

on:
  workflow_run:
    workflows:
      - Release (Windows packaging)
      - Release macOS universal
      - Release Linux
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  windows:
    name: Install MSI (${{ matrix.platform }} ${{ matrix.scope }})
    if: github.event.workflow_run.name == 'Release (Windows packaging)' && github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
            scope: machine
            allusers: '1'
          - platform: x64
            runner: windows-latest
            scope: user
            allusers: '0'
          - platform: arm64
            runner: windows-11-arm
            scope: machine
            allusers: '1'
          - platform: arm64
            runner: windows-11-arm
            scope: user
            allusers: '0'
    steps:
      - name: Check out source from the triggering build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download artifacts from the triggering build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: kattri-windows-${{ matrix.platform }}*
          path: artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install, launch, close, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = (Resolve-Path -LiteralPath artifacts).Path
          $msiFiles = @(Get-ChildItem -LiteralPath $artifactRoot -Filter '*.msi' -File)
          if ($msiFiles.Count -ne 1) { throw "Expected one MSI from the triggering run; found $($msiFiles.Count)." }
          $msi = $msiFiles[0]
          $sidecarFiles = @(Get-ChildItem -LiteralPath $artifactRoot -Filter 'release-native-components.json' -File)
          if ($sidecarFiles.Count -ne 1) { throw "Expected one release-native-components.json sidecar; found $($sidecarFiles.Count)." }
          $sidecar = Get-Content -LiteralPath $sidecarFiles[0].FullName -Raw | ConvertFrom-Json
          if ($sidecar.target -cne 'windows-${{ matrix.platform }}' -or
              $sidecar.source_commit -cne '${{ github.event.workflow_run.head_sha }}') {
            throw 'Downloaded MSI sidecar target or source commit does not match the triggering release run.'
          }
          $packageRecords = @($sidecar.packages | Where-Object { $_.file -ceq $msi.Name })
          if ($packageRecords.Count -ne 1) { throw "Expected one sidecar package record for $($msi.Name); found $($packageRecords.Count)." }
          $packageRecord = $packageRecords[0]
          $msiItem = Get-Item -LiteralPath $msi.FullName
          $msiHash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packageRecord.sha256 -notmatch '^[0-9a-fA-F]{64}$' -or
              $packageRecord.sha256.ToLowerInvariant() -ne $msiHash -or
              $packageRecord.size_bytes -ne $msiItem.Length) {
            throw 'Downloaded MSI hash or size does not match its release sidecar.'
          }

          function Get-SafeArtifactFile([string]$RelativePath) {
            if ([string]::IsNullOrWhiteSpace($RelativePath) -or $RelativePath.Contains('\') -or
                $RelativePath.Contains(':') -or $RelativePath.StartsWith('/') -or
                $RelativePath -match '(^|/)\.{1,2}(/|$)') {
              throw "Sidecar evidence path is not a safe relative path: $RelativePath"
            }
            $candidate = [System.IO.Path]::GetFullPath((Join-Path $artifactRoot ($RelativePath.Replace('/', [System.IO.Path]::DirectorySeparatorChar))))
            $rootPrefix = $artifactRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
            if (-not $candidate.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
                -not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Sidecar evidence file is missing or outside the artifact directory: $RelativePath"
            }
            return (Get-Item -LiteralPath $candidate).FullName
          }

          $expectedMemberRoles = @{
            'Jellyfin Kattri/jellyfin-kattri.exe' = 'executable'
            'Jellyfin Kattri/libmpv-2.dll' = 'native'
            'Jellyfin Kattri/LICENSE.txt' = 'license'
            'Jellyfin Kattri/libmpv-NOTICE.txt' = 'license'
            'Jellyfin Kattri/licenses/libmpv/LICENSE.LGPL' = 'license'
            'Jellyfin Kattri/licenses/libmpv/Copyright' = 'license'
            'Jellyfin Kattri/licenses/libmpv/COPYING.LGPLv3' = 'license'
            'Jellyfin Kattri/licenses/libmpv/LICENSE.md' = 'license'
          }
          $expectedMemberEvidence = @{
            'Jellyfin Kattri/jellyfin-kattri.exe' = 'release-validation/executables/jellyfin-kattri.exe'
            'Jellyfin Kattri/libmpv-2.dll' = 'release-validation/native/libmpv-2.dll'
            'Jellyfin Kattri/LICENSE.txt' = 'release-validation/licenses/project/LICENSE'
            'Jellyfin Kattri/libmpv-NOTICE.txt' = 'release-validation/licenses/libmpv/libmpv-NOTICE.txt'
            'Jellyfin Kattri/licenses/libmpv/LICENSE.LGPL' = 'release-validation/licenses/libmpv/LICENSE.LGPL'
            'Jellyfin Kattri/licenses/libmpv/Copyright' = 'release-validation/licenses/libmpv/Copyright'
            'Jellyfin Kattri/licenses/libmpv/COPYING.LGPLv3' = 'release-validation/licenses/libmpv/COPYING.LGPLv3'
            'Jellyfin Kattri/licenses/libmpv/LICENSE.md' = 'release-validation/licenses/libmpv/LICENSE.md'
          }
          $msiMembers = @($sidecar.package_members | Where-Object { $_.package_file -ceq $msi.Name })
          if ($msiMembers.Count -ne $expectedMemberRoles.Count) {
            throw "Expected $($expectedMemberRoles.Count) MSI member claims; found $($msiMembers.Count)."
          }
          $seenMemberPaths = @{}
          $validatedMsiMembers = @()
          foreach ($member in $msiMembers) {
            if ($null -eq $member -or -not $expectedMemberRoles.ContainsKey([string]$member.path) -or
                $member.role -cne $expectedMemberRoles[[string]$member.path] -or
                $member.evidence_file -cne $expectedMemberEvidence[[string]$member.path]) {
              throw 'MSI sidecar contains an unexpected member path or role.'
            }
            if ($seenMemberPaths.ContainsKey([string]$member.path)) { throw 'MSI sidecar repeats a member path.' }
            $seenMemberPaths[[string]$member.path] = $true
            if ($member.sha256 -notmatch '^[0-9a-fA-F]{64}$' -or
                $member.size_bytes -is [bool] -or $member.size_bytes -lt 0) {
              throw "MSI sidecar member has an invalid hash or size: $($member.path)"
            }
            $evidencePath = Get-SafeArtifactFile ([string]$member.evidence_file)
            $evidenceItem = Get-Item -LiteralPath $evidencePath
            $evidenceHash = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($evidenceItem.Length -ne $member.size_bytes -or $evidenceHash -ne $member.sha256.ToLowerInvariant()) {
              throw "MSI member evidence does not match its sidecar: $($member.path)"
            }
            $validatedMsiMembers += $member
          }
          foreach ($expectedPath in $expectedMemberRoles.Keys) {
            if (-not $seenMemberPaths.ContainsKey($expectedPath)) { throw "MSI sidecar is missing member claim: $expectedPath" }
          }

          New-Item -ItemType Directory -Force -Path smoke-logs | Out-Null
          @("MSI $($msi.Name) size=$($msiItem.Length) sha256=$msiHash") + @(
            $validatedMsiMembers | Sort-Object path | ForEach-Object {
              "Evidence $($_.path) size=$($_.size_bytes) sha256=$($_.sha256.ToLowerInvariant())"
            }
          ) | Set-Content -LiteralPath smoke-logs\sidecar-member-comparisons.txt
          try {
            Get-CimInstance Win32_VideoController |
              Select-Object Name, DriverVersion, VideoProcessor, Status |
              Format-List | Out-File smoke-logs\display-adapters.txt
          } catch {
            "Display adapter diagnostics unavailable: $($_.Exception.GetType().Name)" |
              Out-File smoke-logs\display-adapters.txt
          }
          $installLog = (Resolve-Path smoke-logs).Path + '\msi-install.log'
          $uninstallLog = (Resolve-Path smoke-logs).Path + '\msi-uninstall.log'
          $perMachine = '${{ matrix.allusers }}' -eq '1'
          $extraArgs = if ($perMachine) { @('ALLUSERS=1') } else { @() }
          $installer = Start-Process msiexec.exe -Wait -PassThru -ArgumentList (@('/i', $msi.FullName, '/qn', '/norestart', '/L*v', $installLog) + $extraArgs)
          if ($installer.ExitCode -ne 0) { throw "MSI installation failed with exit code $($installer.ExitCode)" }
          # A plain install is per user under %LOCALAPPDATA%\Programs; ALLUSERS=1 is per machine.
          $installDir = if ($perMachine) {
            Join-Path $env:ProgramFiles 'Jellyfin Kattri'
          } else {
            Join-Path $env:LOCALAPPDATA 'Programs\Jellyfin Kattri'
          }
          $exe = Join-Path $installDir 'jellyfin-kattri.exe'
          $libmpv = Join-Path $installDir 'libmpv-2.dll'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Installed executable is missing: $exe" }
          if (-not (Test-Path -LiteralPath $libmpv)) { throw "Installed libmpv is missing: $libmpv" }
          $comparisonLines = @()
          foreach ($member in $validatedMsiMembers | Sort-Object path) {
            $relativeInstalledPath = $member.path.Substring('Jellyfin Kattri/'.Length).Replace('/', [System.IO.Path]::DirectorySeparatorChar)
            $installedPath = Join-Path $installDir $relativeInstalledPath
            if (-not (Test-Path -LiteralPath $installedPath -PathType Leaf)) {
              throw "Installed MSI member is missing: $($member.path)"
            }
            $installedItem = Get-Item -LiteralPath $installedPath
            $installedHash = (Get-FileHash -LiteralPath $installedPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($installedItem.Length -ne $member.size_bytes -or $installedHash -ne $member.sha256.ToLowerInvariant()) {
              throw "Installed MSI member differs from sidecar evidence: $($member.path)"
            }
            $comparisonLines += "Installed $($member.path) size=$($installedItem.Length) sha256=$installedHash"
          }
          $comparisonLines | Add-Content -LiteralPath smoke-logs\sidecar-member-comparisons.txt
          $libmpvNotice = Join-Path $installDir 'libmpv-NOTICE.txt'
          if (-not (Test-Path -LiteralPath $libmpvNotice)) { throw "Installed libmpv notice is missing: $libmpvNotice" }
          $libmpvLicenseDir = Join-Path $installDir 'licenses\libmpv'
          $libmpvLicensePaths = @()
          $payloadComparisons = @(
            @{ Installed = (Join-Path $installDir 'LICENSE.txt'); Source = (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') },
            @{ Installed = $libmpvNotice; Source = (Join-Path $env:GITHUB_WORKSPACE 'packaging\libmpv\NOTICE.txt') }
          )
          foreach ($licenseName in @('LICENSE.LGPL', 'Copyright', 'COPYING.LGPLv3', 'LICENSE.md')) {
            $licensePath = Join-Path $libmpvLicenseDir $licenseName
            if (-not (Test-Path -LiteralPath $licensePath -PathType Leaf)) { throw "Installed libmpv license file is missing: $licensePath" }
            if ((Get-Item -LiteralPath $licensePath).Length -eq 0) { throw "Installed libmpv license file is empty: $licensePath" }
            $libmpvLicensePaths += $licensePath
            $payloadComparisons += @{ Installed = $licensePath; Source = (Join-Path $env:GITHUB_WORKSPACE "packaging\windows\libmpv-licenses\$licenseName") }
          }
          foreach ($comparison in $payloadComparisons) {
            if (-not (Test-Path -LiteralPath $comparison.Installed -PathType Leaf)) { throw "Installed license payload is missing: $($comparison.Installed)" }
            $expectedHash = (Get-FileHash -LiteralPath $comparison.Source -Algorithm SHA256).Hash
            $actualHash = (Get-FileHash -LiteralPath $comparison.Installed -Algorithm SHA256).Hash
            if ($actualHash -ne $expectedHash) { throw "Installed license payload differs from its source: $($comparison.Installed)" }
          }
          Get-FileHash -LiteralPath (@($exe, $libmpv, $libmpvNotice) + $libmpvLicensePaths) -Algorithm SHA256 |
            Format-Table -AutoSize | Out-File smoke-logs\installed-hashes.txt
          try {
            # GPU-less runners cannot create a WGL context. The window-smoke mode creates the
            # real window and exits without OpenGL, so install, window, close and uninstall are
            # still exercised; the full GL path stays covered on GPU machines.
            $process = Start-Process -FilePath $exe -ArgumentList '--window-smoke' `
              -WorkingDirectory $installDir -PassThru `
              -RedirectStandardOutput smoke-logs\app-stdout.txt `
              -RedirectStandardError smoke-logs\app-stderr.txt
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            do {
              $process.Refresh()
              if ($process.HasExited) { throw "Application exited during startup with code $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'No application window appeared within 60 seconds.' }
            # The handle exists before the window manager publishes the title on some runners,
            # so poll briefly instead of failing on an empty title read.
            $title = $process.MainWindowTitle
            $titleDeadline = [DateTime]::UtcNow.AddSeconds(10)
            while ($title -ne 'Jellyfin Kattri' -and [DateTime]::UtcNow -lt $titleDeadline) {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              $title = $process.MainWindowTitle
            }
            "Window title: $title" | Tee-Object -FilePath smoke-logs\startup.txt
            if ($title -ne 'Jellyfin Kattri') { throw "Unexpected window title: $title" }
            if (-not $process.CloseMainWindow()) { throw 'The application refused the normal close request.' }
            if (-not $process.WaitForExit(15000)) { throw 'Application did not exit after CloseMainWindow.' }
            if ($process.ExitCode -ne 0) { throw "Application exited with code $($process.ExitCode)" }
          }
          finally {
            # Preserve startup diagnostics even when the process exits before a window exists.
            if (Test-Path -LiteralPath smoke-logs\app-stderr.txt) {
              Get-Content -LiteralPath smoke-logs\app-stderr.txt | Write-Host
            }
            $installer = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart', '/L*v', $uninstallLog)
            if ($installer.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($installer.ExitCode)" }
          }
          if (Test-Path -LiteralPath $exe) { throw 'Uninstall left the executable behind.' }
          if (Test-Path -LiteralPath $libmpv) { throw 'Uninstall left libmpv behind.' }
          "PASS: ${{ matrix.scope }} install, native license payload, real-window startup, normal close, and clean uninstall." |
            Tee-Object -FilePath smoke-logs\result.txt -Append

      - name: Upload installation and startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installation-smoke-${{ matrix.platform }}-${{ matrix.scope }}
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 30

  macos:
    name: Mount DMG and launch universal app
    if: github.event.workflow_run.name == 'Release macOS universal' && github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download artifacts from the triggering build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: kattri-*-macos-universal*
          path: artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Mount, install, verify signature, launch, and quit
        run: |
          set -euo pipefail
          mkdir -p smoke-logs "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/Applications"
          DMG="$(find artifacts -name '*.dmg' -print -quit)"
          if [[ -z "$DMG" ]]; then echo 'No DMG was downloaded.' >&2; exit 1; fi
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" | tee smoke-logs/mount.txt
          cleanup() { hdiutil detach "$RUNNER_TEMP/dmg" || true; }
          trap cleanup EXIT
          cp -R "$RUNNER_TEMP/dmg/Jellyfin Kattri.app" "$RUNNER_TEMP/Applications/"
          APP="$RUNNER_TEMP/Applications/Jellyfin Kattri.app"
          test -s "$APP/Contents/Resources/LICENSE"
          test -s "$APP/Contents/Resources/libmpv-NOTICE.txt"
          MPV_LICENSE_DIR="$APP/Contents/Resources/licenses/libmpv"
          for file in BUILD-INFO.txt LICENSE; do
            test -s "$MPV_LICENSE_DIR/$file"
          done
          for file in fribidi.LGPL ffmpeg.LGPL harfbuzz.MIT dav1d.BSD-2-Clause \
            libass.ISC libplacebo.LGPL mpv.LGPL freetype.FTL; do
            test -s "$MPV_LICENSE_DIR/$file"
          done
          codesign --verify --deep --strict "$APP" 2>&1 | tee smoke-logs/codesign.txt
          codesign -dv --verbose=4 "$APP" 2>&1 | tee -a smoke-logs/codesign.txt
          open -a "$APP"
          APP_PID=""
          for _ in $(seq 1 60); do
            APP_PID="$(pgrep -f '^/.*/Jellyfin Kattri.app/Contents/MacOS/jellyfin-kattri$' | head -n 1 || true)"
            [[ -n "$APP_PID" ]] && break
            sleep 1
          done
          if [[ -z "$APP_PID" ]]; then echo 'Application process did not start.' >&2; exit 1; fi
          sleep 10
          kill -0 "$APP_PID"
          osascript -e 'tell application "Jellyfin Kattri" to quit'
          for _ in $(seq 1 15); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo 'PASS: DMG app launched and quit normally.' | tee smoke-logs/result.txt
              exit 0
            fi
            sleep 1
          done
          echo 'Application did not quit normally.' >&2
          exit 1

      - name: Upload macOS startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-installation-smoke
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 30

  linux-deb:
    name: Install deb and launch (Ubuntu 22.04)
    if: github.event.workflow_run.name == 'Release Linux' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kattri-linux-deb-rpm
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install deb and window-check dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./artifacts/kattri_*.deb libxkbcommon-x11-0 xvfb openbox wmctrl xdotool x11-utils libgl1-mesa-dri
      - name: Require a real application window and normal close
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          KATTRI_SMOKE_EXPECT_LIBMPV_PATH='/usr/lib/kattri/libmpv.so.2' \
          KATTRI_SMOKE_EXPECT_LIBJPEG_PATH='/usr/lib/kattri/libjpeg.so.8' \
          KATTRI_SMOKE_LOG="$PWD/smoke-logs/application.txt" \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            packaging/linux/smoke-launch.sh /usr/bin/kattri | tee smoke-logs/window.txt
      - name: Upload deb startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-deb-installation-smoke
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 30

  linux-rpm:
    name: Install rpm and launch (Fedora)
    if: github.event.workflow_run.name == 'Release Linux' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kattri-linux-deb-rpm
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install rpm and window-check dependencies
        run: |
          set -euo pipefail
          dnf install -y ./artifacts/kattri-*.rpm libxkbcommon-x11 xorg-x11-server-Xvfb openbox wmctrl xdotool xwininfo mesa-dri-drivers
      - name: Require a real application window and normal close
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          KATTRI_SMOKE_EXPECT_LIBMPV_PATH='/usr/lib/kattri/libmpv.so.2' \
          KATTRI_SMOKE_EXPECT_LIBJPEG_PATH='/usr/lib/kattri/libjpeg.so.8' \
          KATTRI_SMOKE_LOG="$PWD/smoke-logs/application.txt" \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            packaging/linux/smoke-launch.sh /usr/bin/kattri | tee smoke-logs/window.txt
      - name: Upload rpm startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-rpm-installation-smoke
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 30

  linux-appimage:
    name: Launch AppImage (Ubuntu 22.04)
    if: github.event.workflow_run.name == 'Release Linux' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kattri-linux-appimage
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install window-check dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb openbox wmctrl xdotool x11-utils libgl1-mesa-dri
          chmod +x ./artifacts/kattri-*-linux-x64.AppImage
          APPIMAGE="$(find artifacts -name 'kattri-*-linux-x64.AppImage' -print -quit)"
          if [[ -z "$APPIMAGE" ]]; then echo 'No AppImage was downloaded.' >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/kattri-appimage-content"
          (
            cd "$RUNNER_TEMP/kattri-appimage-content"
            "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null
            APPDIR="$RUNNER_TEMP/kattri-appimage-content/squashfs-root"
            test -s "$APPDIR/usr/bin/kattri"
            test -s "$APPDIR/usr/lib/libmpv.so.2"
            test -s "$APPDIR/usr/lib/libjpeg.so.8"
            test -s "$APPDIR/usr/share/licenses/kattri/LICENSE"
            test -s "$APPDIR/usr/share/licenses/kattri/libmpv-NOTICE.txt"
            test -s "$APPDIR/usr/share/licenses/kattri/BUILD-INFO.txt"
            test -s "$APPDIR/usr/share/licenses/kattri/LICENSE.libjpeg-turbo"
            test -s "$APPDIR/usr/share/licenses/kattri/BUILD-INFO.libjpeg-turbo.txt"
            for file in LICENSE.mpv.LGPL LICENSE.ffmpeg.LGPL LICENSE.libplacebo.LGPL \
              LICENSE.dav1d.BSD-2-Clause LICENSE.libdisplay-info.MIT; do
              test -s "$APPDIR/usr/share/licenses/kattri/$file"
            done
          )
      - name: Require a real application window and normal close
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          TMPDIR=/tmp \
          KATTRI_SMOKE_EXPECT_APPIMAGE_MOUNT=1 \
          KATTRI_SMOKE_LOG="$PWD/smoke-logs/application.txt" \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            packaging/linux/smoke-launch.sh ./artifacts/kattri-*-linux-x64.AppImage | tee smoke-logs/window.txt
      - name: Upload AppImage startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-appimage-installation-smoke
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 30

  linux-flatpak:
    name: Install Flatpak and launch (Ubuntu 24.04)
    if: github.event.workflow_run.name == 'Release Linux' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kattri-linux-flatpak
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install Flatpak and window-check dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb openbox wmctrl xdotool x11-utils libgl1-mesa-dri
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --bundle ./artifacts/kattri-*-linux-x64.flatpak
          flatpak run --command=sh org.kattri.JellyfinKattri -c '
            test -s /app/share/licenses/org.kattri.JellyfinKattri/LICENSE
            test -s /app/share/licenses/libmpv/BUILD-INFO.txt
            for file in /app/share/licenses/libmpv/LICENSE.*; do test -s "$file"; done
            test -s /app/share/licenses/libass/COPYING
            test -s /app/share/licenses/uchardet/COPYING
          '
      - name: Require a real application window and normal close
        run: |
          set -euo pipefail
          mkdir -p smoke-logs
          KATTRI_SMOKE_EXPECT_LIBMPV_PATH='/app/lib/libmpv.so.2' \
          KATTRI_SMOKE_TRACE_LOADER=0 \
          KATTRI_SMOKE_LOG="$PWD/smoke-logs/application.txt" \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            packaging/linux/smoke-launch.sh flatpak run --env=LD_DEBUG=libs org.kattri.JellyfinKattri | tee smoke-logs/window.txt
      - name: Upload Flatpak startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-flatpak-installation-smoke
          path: smoke-logs/
          if-no-files-found: warn
          retention-days: 30
