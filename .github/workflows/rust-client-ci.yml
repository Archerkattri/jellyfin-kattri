# Build and test validation. This does not install libmpv or perform runtime QA.
name: Rust client build and test validation (not runtime QA)

on:
  push:
    paths:
      - "crates/**"
      - "proofs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
      - "scripts/**"
      - "packaging/**"
  pull_request:
    paths:
      - "crates/**"
      - "proofs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
      - "scripts/**"
      - "packaging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux input dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libudev-dev

      # Reads the toolchain, components, and profile from rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check native release target and packaging contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/tests/release_targets.ps1

      - name: Check read-only runner without server access
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/tests/live_runner.ps1

  # Real libmpv runtime: the pinned, SHA-256-verified LGPL libmpv-2.dll from
  # packaging/libmpv/manifest.toml, a software decoder and the null audio/video outputs. It
  # runs the ignored mpv-render runtime tests against the committed 32-second clip. It proves
  # the FFI and the property reads, not visible or audible output.
  libmpv-runtime-windows:
    name: libmpv runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Fetch the pinned libmpv
        shell: pwsh
        run: |
          $library = & packaging/libmpv/fetch.ps1 -Platform ${{ matrix.platform }}
          if (-not (Test-Path -LiteralPath $library)) { throw "fetch.ps1 returned no library" }
          "KATTRI_TEST_LIBMPV=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KATTRI_TEST_MEDIA=$((Resolve-Path proofs/mpv-render/tests/fixtures/clip-h264-aac.mkv).Path)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run libmpv runtime tests
        run: >-
          cargo test --locked -p mpv-render-proof
          --test stream_snapshot_runtime --test controls_runtime
          --test software_decode --test runtime_probe
          -- --ignored --nocapture --test-threads=1

  # ARM64 jobs run the same Rust checks on GitHub's standard ARM64 runners.
  # Native playback and installer acceptance require separate runtime validation.
  check-windows-arm64:
    name: Clippy and tests (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  # Test-only. Linux arm64 release artifacts are deferred by M5-01 and are not built here.
  check-linux-arm64:
    name: Clippy and tests (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux input dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libudev-dev

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked
