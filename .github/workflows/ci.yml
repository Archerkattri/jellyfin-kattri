# Dependency policy, secret scanning and benchmark compilation.

name: CI policy checks

on:
  push:
    branches:
      - rust-main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan history with checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-download.XXXXXX")"
          bin_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-bin.XXXXXX")"
          archive="$download_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" git --redact --no-banner --log-opts=--all .

  deny:
    name: cargo-deny (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Install pinned cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny

      - name: Check licenses, bans, advisories and sources
        run: cargo deny --locked check

  bench-compile:
    name: Benchmarks compile (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Compile benchmarks without running them
        run: cargo bench -p kattri-bench --no-run --locked
