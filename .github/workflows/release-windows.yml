# Windows release packaging. Runs on version tags and produces the dual-purpose MSI
# (per user by default, per machine with ALLUSERS=1) and the portable zip for x64 and
# arm64, with SHA256 checksums for the zip.
#
# Signing:
#   1.0 ships unsigned (owner decision 2026-10-27: no paid certificate and no signing
#   account, as with Jellyfin Media Player). Signing runs only when the repository
#   variable KATTRI_SIGNING_SERVICE is set. Its value is the signtool selector string
#   described at the top of packaging/windows/sign.ps1. No key reaches CI. When the
#   variable is unset, the job still succeeds and the uploaded artifact name ends in
#   "-unsigned".
#
# Variables and secrets referenced:
#   vars.KATTRI_SIGNING_SERVICE   optional signing reference (variable, not a secret)
#   No secrets are referenced.
#
# Binary name:
#   The existing egui-gl-host-proof package provides the jellyfin-kattri executable.

name: Release (Windows packaging)

on:
  push:
    tags:
      - "v*"
  # A dispatch from a branch packages the head with the workspace version, to check the
  # packaging before a tag. Nothing is published either way; the job only uploads artifacts.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          # windows-11-arm is the GitHub-hosted Windows arm64 runner label, per the
          # GitHub-hosted runner documentation. GitHub has announced a successor label
          # (windows-11-vs2026-arm) and a migration of this label; confirm the mapping
          # before relying on the exact image version.
          - platform: arm64
            runner: windows-11-arm
    env:
      KATTRI_BIN: jellyfin-kattri
      KATTRI_SIGNING_SERVICE: ${{ vars.KATTRI_SIGNING_SERVICE }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Derive version from tag
        shell: pwsh
        env:
          KATTRI_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $workspaceVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:KATTRI_TAG) {
            $version = $env:KATTRI_TAG -replace '^v', ''
            # Refuse a tag that does not match the workspace version, matching the macOS and
            # Linux release guards. Otherwise the MSI could be labelled with another version.
            if ("v$workspaceVersion" -ne $env:KATTRI_TAG) {
              throw "Tag '$env:KATTRI_TAG' does not match workspace version '$workspaceVersion'."
            }
          } else {
            $version = $workspaceVersion
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag '$env:KATTRI_TAG' does not give a numeric version (expected vX.Y.Z)."
          }
          "KATTRI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The Rust toolchain is read from rust-toolchain.toml by rustup.
      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked -p egui-gl-host-proof --bin $env:KATTRI_BIN

      - name: Sign executable
        shell: pwsh
        run: packaging/windows/sign.ps1 -Path "target/release/$env:KATTRI_BIN.exe"

      # build-msi.ps1 needs the WiX v4 CLI on PATH; the runner images do not ship it.
      - name: Install WiX 4.0.5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build MSI
        shell: pwsh
        run: >-
          packaging/windows/build-msi.ps1
          -ExePath "target/release/$env:KATTRI_BIN.exe"
          -Version $env:KATTRI_VERSION
          -Platform ${{ matrix.platform }}
          -OutputDir dist

      - name: Sign MSI
        shell: pwsh
        run: packaging/windows/sign.ps1 -Path "dist/JellyfinKattri-$env:KATTRI_VERSION-${{ matrix.platform }}.msi"

      - name: Build portable zip and checksum
        shell: pwsh
        run: >-
          packaging/windows/build-zip.ps1
          -ExePath "target/release/$env:KATTRI_BIN.exe"
          -Version $env:KATTRI_VERSION
          -Platform ${{ matrix.platform }}
          -OutputDir dist

      - name: Mark artifact signing state
        id: signing-state
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KATTRI_SIGNING_SERVICE)) {
            "suffix=-unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "Artifacts in this run are UNSIGNED: KATTRI_SIGNING_SERVICE is not set." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "suffix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "Artifacts in this run were signed through the configured signing service." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Refresh MSI checksum and write native component sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = '${{ matrix.platform }}'
          $msiName = "JellyfinKattri-$env:KATTRI_VERSION-$platform.msi"
          $zipName = "JellyfinKattri-$env:KATTRI_VERSION-$platform-portable.zip"
          $msiPath = Join-Path 'dist' $msiName
          $zipPath = Join-Path 'dist' $zipName
          # Optional signing changes the MSI after build-msi wrote its initial checksum.
          $msiHash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$msiPath.sha256" -Value "$msiHash  $msiName" -Encoding ascii

          . (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/libmpv-licenses.ps1')
          $repoRoot = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $pin = Get-LibmpvManifestPin -RepositoryRoot $repoRoot -Platform "windows-$platform"
          $licenseFiles = @(Get-VerifiedLibmpvLicenseFiles)
          $evidenceRoot = Join-Path 'dist/release-validation'
          $nativeEvidence = Join-Path $evidenceRoot 'native/libmpv-2.dll'
          $licenseEvidenceRoot = Join-Path $evidenceRoot 'licenses/libmpv'
          $projectLicenseEvidence = Join-Path $evidenceRoot 'licenses/project/LICENSE'
          $executableEvidence = Join-Path $evidenceRoot 'executables/jellyfin-kattri.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $nativeEvidence), $licenseEvidenceRoot, (Split-Path -Parent $projectLicenseEvidence), (Split-Path -Parent $executableEvidence) | Out-Null
          Copy-Item -LiteralPath "target/libmpv/windows-$platform/libmpv-2.dll" -Destination $nativeEvidence -Force
          Copy-Item -LiteralPath "target/release/$env:KATTRI_BIN.exe" -Destination $executableEvidence -Force
          Copy-Item -LiteralPath (Join-Path $repoRoot 'LICENSE') -Destination $projectLicenseEvidence -Force
          $noticePath = Get-LibmpvNoticePath -RepositoryRoot $repoRoot
          $noticeEvidence = Join-Path $licenseEvidenceRoot 'libmpv-NOTICE.txt'
          Copy-Item -LiteralPath $noticePath -Destination $noticeEvidence -Force
          foreach ($license in $licenseFiles) {
            Copy-Item -LiteralPath $license.Path -Destination (Join-Path $licenseEvidenceRoot $license.Name) -Force
          }

          $packageNames = @($msiName, $zipName)
          $nativeComponents = foreach ($packageName in $packageNames) {
            $packagePrefix = if ($packageName -like '*.zip') {
              '{0}/' -f [System.IO.Path]::GetFileNameWithoutExtension($packageName)
            } else {
              'Jellyfin Kattri/'
            }
            $licenseRecords = @(
              @{ path = "${packagePrefix}libmpv-NOTICE.txt"; evidence_file = 'release-validation/licenses/libmpv/libmpv-NOTICE.txt' }
            ) + @($licenseFiles | ForEach-Object {
              @{ path = "${packagePrefix}licenses/libmpv/$($_.Name)"; evidence_file = "release-validation/licenses/libmpv/$($_.Name)" }
            })
            @{
              package_file = $packageName
              name = 'libmpv'
              manifest_platform = "windows-$platform"
              packaged_file = "${packagePrefix}libmpv-2.dll"
              evidence_file = 'release-validation/native/libmpv-2.dll'
              license_files = $licenseRecords
            }
          }
          $executables = foreach ($packageName in $packageNames) {
            $packagePrefix = if ($packageName -like '*.zip') {
              '{0}/' -f [System.IO.Path]::GetFileNameWithoutExtension($packageName)
            }
            $executable = @{
              package_file = $packageName
              file = 'release-validation/executables/jellyfin-kattri.exe'
              audit_scope = 'The exact packaged executable hash is recorded. This release job did not produce cargo-auditable metadata or a cargo audit bin record.'
            }
            if ($packagePrefix) {
              $executable.packaged_file = "${packagePrefix}jellyfin-kattri.exe"
            }
            $executable
          }
          $zipPrefix = '{0}/' -f [System.IO.Path]::GetFileNameWithoutExtension($zipName)
          $packageMembers = @(
            @{
              package_file = $zipName
              path = "${zipPrefix}jellyfin-kattri.exe"
              role = 'executable'
              evidence_file = 'release-validation/executables/jellyfin-kattri.exe'
            },
            @{
              package_file = $zipName
              path = "${zipPrefix}libmpv-2.dll"
              role = 'native'
              evidence_file = 'release-validation/native/libmpv-2.dll'
            },
            @{
              package_file = $zipName
              path = "${zipPrefix}LICENSE"
              role = 'license'
              evidence_file = 'release-validation/licenses/project/LICENSE'
            },
            @{
              package_file = $zipName
              path = "${zipPrefix}libmpv-NOTICE.txt"
              role = 'license'
              evidence_file = 'release-validation/licenses/libmpv/libmpv-NOTICE.txt'
            }
          )
          $packageMembers += @($licenseFiles | ForEach-Object {
            @{
              package_file = $zipName
              path = "${zipPrefix}licenses/libmpv/$($_.Name)"
              role = 'license'
              evidence_file = "release-validation/licenses/libmpv/$($_.Name)"
            }
          })
          $spec = @{
            source_commit = $env:GITHUB_SHA
            target = "windows-$platform"
            packages = $packageNames
            native_components = @($nativeComponents)
            executables = @($executables)
            package_members = @($packageMembers)
            inventory_gaps = @('The pinned Windows libmpv archive contains no BUILD-INFO.txt; the source versions and license claim are taken verbatim from packaging/libmpv/manifest.toml.')
          }
          $specPath = Join-Path $env:RUNNER_TEMP 'release-native-components-input.json'
          $spec | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $specPath -Encoding utf8
          python packaging/write-release-native-sidecar.py `
            --artifact-root dist `
            --spec $specPath `
            --output release-native-components.json `
            --libmpv-manifest packaging/libmpv/manifest.toml

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kattri-windows-${{ matrix.platform }}${{ steps.signing-state.outputs.suffix }}
          path: |
            dist/JellyfinKattri-*.msi
            dist/JellyfinKattri-*.msi.sha256
            dist/JellyfinKattri-*-portable.zip
            dist/JellyfinKattri-*-portable.zip.sha256
            dist/release-native-components.json
            dist/release-validation/**
          if-no-files-found: error
          retention-days: 30
