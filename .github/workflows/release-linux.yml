# Linux release build: one shared release binary, then an AppImage and the deb and rpm
# packages. The reference distribution is Ubuntu 22.04 (the build image, so the glibc
# floor is the oldest one the release targets). Runner: ubuntu-22.04, confirmed against
# the actions/runner-images README, which lists ubuntu-22.04 as an x64 image.
#
# The Flatpak job builds packaging/flatpak/org.kattri.JellyfinKattri.yml into a bundle.
#
# The AppImage, deb, and rpm bundle the pinned, SHA-256-verified libmpv archive
# (packaging/libmpv/manifest.toml, linux-x64). Deb and rpm keep it in /usr/lib/kattri,
# with only its required native libraries declared as dependencies. installation-smoke.yml
# installs and launches the produced packages in fresh runners; that is not playback validation.

name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Install system packages for the build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev

      - name: Build release binary
        run: cargo build --release --locked -p egui-gl-host-proof --bin jellyfin-kattri

      - name: Record glibc floor and linked libraries
        run: |
          set -euo pipefail
          BIN=target/release/jellyfin-kattri
          mkdir -p dist/linux
          {
            echo "glibc symbol versions required:"
            objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
            echo "dynamic dependencies:"
            ldd "$BIN"
          } | tee dist/linux/BUILD-INFO.txt

      - name: Upload build record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kattri-linux-build-info
          path: dist/linux/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kattri-linux-binary
          path: target/release/jellyfin-kattri
          if-no-files-found: error
          retention-days: 7

  appimage:
    name: AppImage (x64)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kattri-linux-binary
          path: target/release

      # libmpv comes from the pinned archive (packaging/libmpv/fetch.sh linux-x64, called by
      # build-appimage.sh). linuxdeploy resolves its shared dependencies from the host, so the
      # libraries named in that archive's BUILD-INFO.txt are installed here.
      - name: Install AppImage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils file libfuse2 \
            libass9 libuchardet0 libva2 libva-drm2 libdrm2 libgbm1 libegl1 \
            libx11-6 libxfixes3 libasound2 libpulse0 libjpeg8 zlib1g libxkbcommon-x11-0

      - name: Build AppImage
        env:
          KATTRI_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          chmod 755 target/release/jellyfin-kattri
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$KATTRI_RELEASE_VERSION" != "" && "$KATTRI_RELEASE_VERSION" != "v$VERSION" ]]; then
            echo "error: tag $KATTRI_RELEASE_VERSION does not match workspace version $VERSION" >&2
            exit 1
          fi
          # Update information is embedded only for tagged releases. It names the release
          # asset pattern that AppImageUpdate reads. See the comment in build-appimage.sh.
          UPDATE_INFO=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            UPDATE_INFO="gh-releases-zsync|Archerkattri|jellyfin-kattri|latest|kattri-*-linux-x64.AppImage.zsync"
          fi
          UPDATE_INFO="$UPDATE_INFO" \
            packaging/linux/appimage/build-appimage.sh "$VERSION" \
            target/release/jellyfin-kattri dist/linux

      - name: Write AppImage native component sidecar
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          APPIMAGE_NAME="$(basename "$(find dist/linux -maxdepth 1 -name 'kattri-*-linux-x64.AppImage' -print -quit)")"
          if [[ -z "$APPIMAGE_NAME" ]]; then echo 'AppImage package is missing' >&2; exit 1; fi
          python3 - "$RUNNER_TEMP/release-native-components-input.json" "$APPIMAGE_NAME" "$SOURCE_COMMIT" <<'PY'
          import json
          import sys
          from pathlib import Path

          spec_path, package, commit = sys.argv[1:]
          evidence = "release-validation"
          libmpv_names = [
              "BUILD-INFO.txt", "libmpv-NOTICE.txt", "LICENSE.mpv.LGPL", "LICENSE.ffmpeg.LGPL",
              "LICENSE.libplacebo.LGPL", "LICENSE.dav1d.BSD-2-Clause", "LICENSE.libdisplay-info.MIT",
          ]
          libjpeg_copyright = Path("dist/linux/release-validation/licenses/libjpeg-turbo/LICENSE.libjpeg-turbo").read_text(encoding="utf-8")
          libjpeg_claim = next((line.split(":", 1)[1].strip() for line in libjpeg_copyright.splitlines() if line.startswith("License:")), None)
          if not libjpeg_claim:
              raise SystemExit("libjpeg copyright payload has no License field")
          libjpeg_version = Path("dist/linux/release-validation/licenses/libjpeg-turbo/BUILD-INFO.libjpeg-turbo.txt").read_text(encoding="utf-8").strip()
          components = [{
              "package_file": package,
              "name": "libmpv",
              "manifest_platform": "linux-x64",
              "packaged_file": "usr/lib/libmpv.so.2",
              "evidence_file": f"{evidence}/native/libmpv.so.2",
              "build_info_path": "usr/share/licenses/kattri/BUILD-INFO.txt",
              "build_info_evidence_file": f"{evidence}/licenses/libmpv/BUILD-INFO.txt",
              "license_files": [
                  {"path": f"usr/share/licenses/kattri/{name}", "evidence_file": f"{evidence}/licenses/libmpv/{name}"}
                  for name in libmpv_names
              ],
          }, {
              "package_file": package,
              "name": "libjpeg-turbo",
              "version": libjpeg_version,
              "source_url": "https://packages.ubuntu.com/jammy/libjpeg-turbo8",
              "license_claim": libjpeg_claim,
              "packaged_file": "usr/lib/libjpeg.so.8",
              "evidence_file": f"{evidence}/native/libjpeg.so.8",
              "build_info_path": "usr/share/licenses/kattri/BUILD-INFO.libjpeg-turbo.txt",
              "build_info_evidence_file": f"{evidence}/licenses/libjpeg-turbo/BUILD-INFO.libjpeg-turbo.txt",
              "license_files": [{
                  "path": "usr/share/licenses/kattri/LICENSE.libjpeg-turbo",
                  "evidence_file": f"{evidence}/licenses/libjpeg-turbo/LICENSE.libjpeg-turbo",
              }],
          }]
          library_list = Path("dist/linux/release-validation/linuxdeploy-shared-libraries.txt").read_text(encoding="utf-8").splitlines()
          known = {"libmpv.so.2", "libjpeg.so.8"}
          gaps = [
              f"AppImage linuxdeploy bundled shared library {name}; per-library source, version, and license metadata were not pinned by this build."
              for name in library_list if Path(name).name not in known
          ]
          gaps.append("libjpeg-turbo8 is copied from the Ubuntu 22.04 runner package; its source archive SHA-256 is not pinned by this workflow.")
          gaps.append("This release job did not produce a package-specific cargo audit bin record.")
          spec = {
              "source_commit": commit,
              "target": "linux-x64",
              "packages": [package],
              "native_components": components,
              "executables": [{
                  "package_file": package,
                  "file": f"{evidence}/executables/kattri",
                  "audit_scope": "Exact executable payload bytes are exported. This release job did not produce cargo-auditable metadata or a cargo audit bin record.",
              }],
              "inventory_gaps": gaps,
          }
          with open(spec_path, "w", encoding="utf-8") as output:
              json.dump(spec, output, indent=2)
              output.write("\n")
          PY
          python3 packaging/write-release-native-sidecar.py \
            --artifact-root dist/linux \
            --spec "$RUNNER_TEMP/release-native-components-input.json" \
            --output release-native-components.json \
            --libmpv-manifest packaging/libmpv/manifest.toml

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kattri-linux-appimage
          path: |
            dist/linux/kattri-*-linux-x64.AppImage
            dist/linux/kattri-*-linux-x64.AppImage.sha256
            dist/linux/kattri-*-linux-x64.AppImage.zsync
            dist/linux/release-native-components.json
            dist/linux/release-validation/**
          if-no-files-found: error
          retention-days: 30

  packages:
    name: deb and rpm
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f

      - name: Download release binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kattri-linux-binary
          path: target/release

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev lintian rpmlint pkg-config libudev-dev patchelf libjpeg8 \
            libass9 libuchardet0 libva2 libva-drm2 libdrm2 libgbm1 libegl1 \
            libx11-6 libxfixes3 libasound2 libpulse0 zlib1g libstdc++6 libxkbcommon-x11-0

      - name: Fetch and stage the pinned libmpv runtime
        run: |
          set -euo pipefail
          LIBMPV="$(packaging/libmpv/fetch.sh linux-x64)"
          shopt -s nullglob
          ARCHIVES=(target/libmpv/linux-x64/*.tar.gz)
          if [[ ${#ARCHIVES[@]} -ne 1 ]]; then
            echo "error: expected one checksum-verified Linux libmpv archive, found ${#ARCHIVES[@]}" >&2
            exit 1
          fi
          mkdir -p target/kattri-libmpv
          tar -xzf "${ARCHIVES[0]}" --strip-components=1 -C target/kattri-libmpv
          cmp "$LIBMPV" target/kattri-libmpv/libmpv.so.2
          for file in BUILD-INFO.txt \
            LICENSE.mpv.LGPL LICENSE.ffmpeg.LGPL LICENSE.libplacebo.LGPL \
            LICENSE.dav1d.BSD-2-Clause LICENSE.libdisplay-info.MIT; do
            test -s "target/kattri-libmpv/$file"
          done

          # Fedora does not provide libjpeg.so.8. Keep that ABI beside libmpv and
          # use $ORIGIN only for libmpv's private dependency lookup.
          LIBJPEG="$(ldconfig -p | awk '
            $1 == "libjpeg.so.8" && !found { path = $NF; found = 1 }
            END { if (found) print path }
          ')"
          if [[ -z "$LIBJPEG" || ! -f "$LIBJPEG" ]]; then
            echo "error: libjpeg.so.8 from Ubuntu's libjpeg8 package was not found" >&2
            exit 1
          fi
          install -m 755 "$LIBJPEG" target/kattri-libmpv/libjpeg.so.8
          install -m 644 /usr/share/doc/libjpeg-turbo8/copyright \
            target/kattri-libmpv/LICENSE.libjpeg-turbo
          dpkg-query -W -f='${Package} ${Version}\n' libjpeg-turbo8 \
            > target/kattri-libmpv/BUILD-INFO.libjpeg-turbo.txt
          patchelf --set-rpath '$ORIGIN' target/kattri-libmpv/libmpv.so.2
          test "$(patchelf --print-rpath target/kattri-libmpv/libmpv.so.2)" = '$ORIGIN'
          if ldd target/kattri-libmpv/libmpv.so.2 | grep -q 'not found'; then
            echo "error: the staged libmpv has unresolved native dependencies" >&2
            ldd target/kattri-libmpv/libmpv.so.2 >&2
            exit 1
          fi
          if ! ldd target/kattri-libmpv/libmpv.so.2 | grep -Fq 'target/kattri-libmpv/libjpeg.so.8'; then
            echo 'error: libmpv did not resolve its private libjpeg.so.8 through $ORIGIN' >&2
            ldd target/kattri-libmpv/libmpv.so.2 >&2
            exit 1
          fi

      - name: Install cargo-deb and cargo-generate-rpm (pinned)
        run: |
          set -euo pipefail
          cargo install --locked --version 3.8.0 cargo-deb
          cargo install --locked --version 0.21.1 cargo-generate-rpm

      - name: Build deb
        run: |
          set -euo pipefail
          chmod 755 target/release/jellyfin-kattri
          gzip -9n -c packaging/linux/share/kattri.1 > target/kattri.1.gz
          # cargo-deb reads the package metadata from this CI-only manifest fragment.
          # The release binary is already built, so cargo deb does not rebuild it.
          echo >> proofs/egui-gl-host/Cargo.toml
          cat packaging/linux/deb/cargo-deb.toml >> proofs/egui-gl-host/Cargo.toml
          cargo deb -p egui-gl-host-proof --no-build
          mkdir -p dist/linux
          mv target/debian/kattri_*.deb dist/linux/

      - name: Build rpm
        run: |
          set -euo pipefail
          # cargo-generate-rpm 0.21.0 did not read the metadata from --metadata-overwrite
          # (it failed with "Missing field: package.metadata.generate-rpm"). The table is
          # appended to the crate manifest instead, as the deb step does for cargo-deb.
          # The rpm carries a stripped binary; the release profile keeps debug info.
          strip -o target/kattri-stripped target/release/jellyfin-kattri
          grep -v '^#' packaging/linux/rpm/generate-rpm.toml >> proofs/egui-gl-host/Cargo.toml
          cargo generate-rpm -p proofs/egui-gl-host
          mv target/generate-rpm/kattri-*.rpm dist/linux/

      - name: Lint packages
        run: |
          set -euo pipefail
          # lintian fails the job on errors. rpmlint is recorded but not gating yet.
          lintian --fail-on error dist/linux/*.deb
          rpmlint dist/linux/*.rpm || echo "rpmlint reported findings (not gating)"

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist/linux
          for f in kattri_*.deb kattri-*.rpm; do sha256sum "$f" > "$f.sha256"; done

      - name: Stage package evidence and write native component sidecar
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ROOT=dist/linux
          EVIDENCE="$ROOT/release-validation"
          mkdir -p "$EVIDENCE/native" "$EVIDENCE/licenses/libmpv" \
            "$EVIDENCE/licenses/libjpeg-turbo" "$EVIDENCE/executables"
          cp target/kattri-libmpv/libmpv.so.2 "$EVIDENCE/native/libmpv.so.2"
          cp target/kattri-libmpv/libjpeg.so.8 "$EVIDENCE/native/libjpeg.so.8"
          for file in BUILD-INFO.txt LICENSE.mpv.LGPL LICENSE.ffmpeg.LGPL \
            LICENSE.libplacebo.LGPL LICENSE.dav1d.BSD-2-Clause LICENSE.libdisplay-info.MIT; do
            cp "target/kattri-libmpv/$file" "$EVIDENCE/licenses/libmpv/$file"
          done
          cp packaging/libmpv/NOTICE.txt "$EVIDENCE/licenses/libmpv/libmpv-NOTICE.txt"
          cp target/kattri-libmpv/LICENSE.libjpeg-turbo "$EVIDENCE/licenses/libjpeg-turbo/LICENSE.libjpeg-turbo"
          cp target/kattri-libmpv/BUILD-INFO.libjpeg-turbo.txt \
            "$EVIDENCE/licenses/libjpeg-turbo/BUILD-INFO.libjpeg-turbo.txt"

          # cargo-deb may strip the release executable, so export the exact installed bytes.
          DEB="$(find "$ROOT" -maxdepth 1 -name 'kattri_*.deb' -print -quit)"
          if [[ -z "$DEB" ]]; then echo 'no deb package found' >&2; exit 1; fi
          DEB_STAGE="$(mktemp -d "$RUNNER_TEMP/kattri-deb.XXXXXX")"
          trap 'rm -rf "$DEB_STAGE"' EXIT
          dpkg-deb -x "$DEB" "$DEB_STAGE"
          cp "$DEB_STAGE/usr/bin/kattri" "$EVIDENCE/executables/kattri-deb"
          cp target/kattri-stripped "$EVIDENCE/executables/kattri-rpm"

          python3 - "$RUNNER_TEMP/release-native-components-input.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path("dist/linux")
          evidence = "release-validation"
          packages = sorted([p.name for p in root.glob("kattri_*.deb")] + [p.name for p in root.glob("kattri-*.rpm")])
          if len(packages) != 2:
              raise SystemExit(f"expected one deb and one rpm, found {packages}")
          libjpeg_build = (root / evidence / "licenses/libjpeg-turbo/BUILD-INFO.libjpeg-turbo.txt").read_text(encoding="utf-8").strip()
          copyright_text = (root / evidence / "licenses/libjpeg-turbo/LICENSE.libjpeg-turbo").read_text(encoding="utf-8")
          libjpeg_license = next((line.split(":", 1)[1].strip() for line in copyright_text.splitlines() if line.startswith("License:")), None)
          if not libjpeg_license:
              raise SystemExit("the installed libjpeg copyright file has no License field")
          components = []
          executables = []
          for package in packages:
              is_deb = package.endswith(".deb")
              libmpv_license_root = "usr/share/doc/kattri/licenses" if is_deb else "usr/share/licenses/kattri"
              libmpv_notice = "usr/share/doc/kattri/libmpv-NOTICE.txt" if is_deb else "usr/share/licenses/kattri/libmpv-NOTICE.txt"
              libmpv_build = "usr/share/doc/kattri/libmpv-BUILD-INFO.txt" if is_deb else "usr/share/licenses/kattri/libmpv-BUILD-INFO.txt"
              libmpv_licenses = [
                  ("libmpv.LGPL", "LICENSE.mpv.LGPL"),
                  ("ffmpeg.LGPL", "LICENSE.ffmpeg.LGPL"),
                  ("libplacebo.LGPL", "LICENSE.libplacebo.LGPL"),
                  ("dav1d.BSD-2-Clause", "LICENSE.dav1d.BSD-2-Clause"),
                  ("libdisplay-info.MIT", "LICENSE.libdisplay-info.MIT"),
              ] if is_deb else [
                  ("LICENSE.mpv.LGPL", "LICENSE.mpv.LGPL"),
                  ("LICENSE.ffmpeg.LGPL", "LICENSE.ffmpeg.LGPL"),
                  ("LICENSE.libplacebo.LGPL", "LICENSE.libplacebo.LGPL"),
                  ("LICENSE.dav1d.BSD-2-Clause", "LICENSE.dav1d.BSD-2-Clause"),
                  ("LICENSE.libdisplay-info.MIT", "LICENSE.libdisplay-info.MIT"),
              ]
              components.append({
                  "package_file": package,
                  "name": "libmpv",
                  "manifest_platform": "linux-x64",
                  "packaged_file": "usr/lib/kattri/libmpv.so.2",
                  "evidence_file": f"{evidence}/native/libmpv.so.2",
                  "build_info_path": libmpv_build,
                  "build_info_evidence_file": f"{evidence}/licenses/libmpv/BUILD-INFO.txt",
                  "license_files": [
                      {"path": libmpv_notice, "evidence_file": f"{evidence}/licenses/libmpv/libmpv-NOTICE.txt"},
                      *[{"path": f"{libmpv_license_root}/{package_name}", "evidence_file": f"{evidence}/licenses/libmpv/{source_name}"} for package_name, source_name in libmpv_licenses],
                  ],
              })
              jpeg_license_path = "usr/share/doc/kattri/licenses/libjpeg-turbo" if is_deb else "usr/share/licenses/kattri/LICENSE.libjpeg-turbo"
              jpeg_build_path = "usr/share/doc/kattri/libjpeg-turbo-BUILD-INFO.txt" if is_deb else "usr/share/licenses/kattri/libjpeg-turbo-BUILD-INFO.txt"
              components.append({
                  "package_file": package,
                  "name": "libjpeg-turbo",
                  "version": libjpeg_build,
                  "source_url": "https://packages.ubuntu.com/jammy/libjpeg-turbo8",
                  "license_claim": libjpeg_license,
                  "packaged_file": "usr/lib/kattri/libjpeg.so.8",
                  "evidence_file": f"{evidence}/native/libjpeg.so.8",
                  "build_info_path": jpeg_build_path,
                  "build_info_evidence_file": f"{evidence}/licenses/libjpeg-turbo/BUILD-INFO.libjpeg-turbo.txt",
                  "license_files": [{"path": jpeg_license_path, "evidence_file": f"{evidence}/licenses/libjpeg-turbo/LICENSE.libjpeg-turbo"}],
              })
              executable = "kattri-deb" if is_deb else "kattri-rpm"
              executables.append({
                  "package_file": package,
                  "file": f"{evidence}/executables/{executable}",
                  "audit_scope": "Exact executable payload bytes are exported. This release job did not produce cargo-auditable metadata or a cargo audit bin record.",
              })
          spec = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "target": "linux-x64",
              "packages": packages,
              "native_components": components,
              "executables": executables,
              "inventory_gaps": [
                  "libjpeg-turbo8 is copied from the Ubuntu 22.04 runner package; its package version and Debian copyright metadata are recorded, but no source archive checksum is pinned by this workflow.",
                  "This release job did not produce package-specific cargo audit bin records.",
              ],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(spec, output, indent=2)
              output.write("\n")
          PY
          python3 packaging/write-release-native-sidecar.py \
            --artifact-root "$ROOT" \
            --spec "$RUNNER_TEMP/release-native-components-input.json" \
            --output release-native-components.json \
            --libmpv-manifest packaging/libmpv/manifest.toml

      - name: Upload deb and rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kattri-linux-deb-rpm
          path: |
            dist/linux/kattri_*.deb
            dist/linux/kattri_*.deb.sha256
            dist/linux/kattri-*.rpm
            dist/linux/kattri-*.rpm.sha256
            dist/linux/release-native-components.json
            dist/linux/release-validation/**
          if-no-files-found: error
          retention-days: 30

  # Flatpak bundle (M5-10). It builds offline from Cargo.lock: flatpak-cargo-generator writes
  # cargo-sources.json next to the manifest, then flatpak-builder installs the pinned runtime
  # and SDK from Flathub and builds with the Rust release pinned in the manifest.
  # flatpak-builder-tools is pinned to an upstream commit.
  flatpak:
    name: Flatpak (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common python3-aiohttp python3-tomlkit
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate cargo-sources.json
        run: |
          set -euo pipefail
          FBT_COMMIT=9d86d336a39b9af38b86f114b6ce5820fe260f91
          git init "$RUNNER_TEMP/fbt"
          git -C "$RUNNER_TEMP/fbt" remote add origin https://github.com/flatpak/flatpak-builder-tools.git
          git -C "$RUNNER_TEMP/fbt" fetch --depth 1 origin "$FBT_COMMIT"
          git -C "$RUNNER_TEMP/fbt" checkout --detach FETCH_HEAD
          ACTUAL_FBT_COMMIT="$(git -C "$RUNNER_TEMP/fbt" rev-parse HEAD)"
          if [[ "$ACTUAL_FBT_COMMIT" != "$FBT_COMMIT" ]]; then
            echo "error: expected flatpak-builder-tools commit $FBT_COMMIT, got $ACTUAL_FBT_COMMIT" >&2
            exit 1
          fi
          echo "flatpak-builder-tools commit: $ACTUAL_FBT_COMMIT"
          python3 "$RUNNER_TEMP/fbt/cargo/flatpak-cargo-generator.py" Cargo.lock \
            -o packaging/flatpak/cargo-sources.json

      - name: Build Flatpak bundle
        env:
          KATTRI_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$KATTRI_RELEASE_VERSION" != "" && "$KATTRI_RELEASE_VERSION" != "v$VERSION" ]]; then
            echo "error: tag $KATTRI_RELEASE_VERSION does not match workspace version $VERSION" >&2
            exit 1
          fi
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" \
            packaging/flatpak/org.kattri.JellyfinKattri.yml
          mkdir -p dist/linux
          flatpak build-bundle "$RUNNER_TEMP/repo" \
            "dist/linux/kattri-${VERSION}-linux-x64.flatpak" org.kattri.JellyfinKattri
          cd dist/linux
          sha256sum "kattri-${VERSION}-linux-x64.flatpak" > "kattri-${VERSION}-linux-x64.flatpak.sha256"

      - name: Write Flatpak native component sidecar
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ROOT=dist/linux
          PACKAGE="$(basename "$ROOT"/kattri-*-linux-x64.flatpak)"
          FILES="$RUNNER_TEMP/build/files"
          EVIDENCE="$ROOT/release-validation"
          mkdir -p "$EVIDENCE/native" "$EVIDENCE/licenses/libmpv" \
            "$EVIDENCE/licenses/libass" "$EVIDENCE/licenses/uchardet" \
            "$EVIDENCE/licenses/kattri" "$EVIDENCE/executables"
          for native in libmpv.so.2 libass.so.9 libuchardet.so.0; do
            if [ -f "$FILES/lib/$native" ]; then
              cp -L "$FILES/lib/$native" "$EVIDENCE/native/$native"
            else
              echo "host-provided runtime library, not hashed: $native" >&2
            fi
          done
          cp "$FILES/bin/kattri" "$EVIDENCE/executables/kattri"
          cp "$FILES/share/licenses/libmpv/BUILD-INFO.txt" "$EVIDENCE/licenses/libmpv/BUILD-INFO.txt"
          for license in LICENSE.mpv.LGPL LICENSE.ffmpeg.LGPL LICENSE.libplacebo.LGPL \
            LICENSE.dav1d.BSD-2-Clause LICENSE.libdisplay-info.MIT; do
            cp "$FILES/share/licenses/libmpv/$license" "$EVIDENCE/licenses/libmpv/$license"
          done
          for optional in licenses/libass/COPYING licenses/uchardet/COPYING; do
            if [ -f "$FILES/share/$optional" ]; then
              cp "$FILES/share/$optional" "$EVIDENCE/$optional"
            else
              echo "host-provided runtime license, not hashed: $optional" >&2
            fi
          done
          cp "$FILES/share/licenses/org.kattri.JellyfinKattri/LICENSE" "$EVIDENCE/licenses/kattri/LICENSE"
          python3 - "$RUNNER_TEMP/release-native-input.json" "$PACKAGE" "$SOURCE_COMMIT" <<'PY'
          import json
          import sys
          from pathlib import Path

          spec_path, package, commit = sys.argv[1:]
          evidence = "release-validation"
          components = [{
              "package_file": package,
              "name": "libmpv",
              "manifest_platform": "linux-x64",
              "packaged_file": "lib/libmpv.so.2",
              "evidence_file": f"{evidence}/native/libmpv.so.2",
              "build_info_path": "share/licenses/libmpv/BUILD-INFO.txt",
              "build_info_evidence_file": f"{evidence}/licenses/libmpv/BUILD-INFO.txt",
              "license_files": [
                  {"path": f"share/licenses/libmpv/{name}",
                   "evidence_file": f"{evidence}/licenses/libmpv/{name}"}
                  for name in [
                      "LICENSE.mpv.LGPL", "LICENSE.ffmpeg.LGPL", "LICENSE.libplacebo.LGPL", "LICENSE.dav1d.BSD-2-Clause",
                      "LICENSE.libdisplay-info.MIT",
                  ]
              ],
          }, {
              "package_file": package,
              "name": "libass",
              "version": "0.17.4",
              "source_url": "https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz",
              "source_archive_sha256": "78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a",
              "license_claim": "ISC",
              "packaged_file": "lib/libass.so.9",
              "evidence_file": f"{evidence}/native/libass.so.9",
              "license_files": [{"path": "share/licenses/libass/COPYING",
                                 "evidence_file": f"{evidence}/licenses/libass/COPYING"}],
          }, {
              "package_file": package,
              "name": "uchardet",
              "version": "0.0.8",
              "source_url": "https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz",
              "source_archive_sha256": "e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0",
              "license_claim": "MPL-1.1",
              "packaged_file": "lib/libuchardet.so.0",
              "evidence_file": f"{evidence}/native/libuchardet.so.0",
              "license_files": [{"path": "share/licenses/uchardet/COPYING",
                                 "evidence_file": f"{evidence}/licenses/uchardet/COPYING"}],
          }]
          # A Flatpak runtime may provide libass/libuchardet itself; only components whose evidence
          # copy exists are hashed, so the sidecar never claims a file the bundle does not carry.
          components = [component for component in components if Path(component["evidence_file"]).exists()]
          for component in components:
              component["license_files"] = [
                  entry for entry in component["license_files"] if Path(entry["evidence_file"]).exists()
              ]
          spec = {
              "source_commit": commit,
              "target": "linux-x64",
              "packages": [package],
              "native_components": components,
              "executables": [{
                  "package_file": package,
                  "file": f"{evidence}/executables/kattri",
                  "audit_scope": "Exact executable payload bytes are exported. This release job did not produce cargo-auditable metadata or a cargo audit bin record.",
              }],
              "inventory_gaps": [
                  "The Flatpak runtime branch is pinned to 25.08, but host-provided runtime libraries are not separately source-hashed in this sidecar.",
                  "This release job did not produce a package-specific cargo audit bin record.",
              ],
          }
          with open(spec_path, "w", encoding="utf-8") as output:
              json.dump(spec, output, indent=2)
              output.write("\n")
          PY
          python3 packaging/write-release-native-sidecar.py \
            --artifact-root "$ROOT" \
            --spec "$RUNNER_TEMP/release-native-input.json" \
            --output release-native-components.json \
            --libmpv-manifest packaging/libmpv/manifest.toml

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kattri-linux-flatpak
          path: |
            dist/linux/kattri-*-linux-x64.flatpak
            dist/linux/kattri-*-linux-x64.flatpak.sha256
            dist/linux/release-native-components.json
            dist/linux/release-validation/**
          if-no-files-found: error
          retention-days: 30
